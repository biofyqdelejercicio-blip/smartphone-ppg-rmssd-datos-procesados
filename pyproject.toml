[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-rmssd-reconstruction"
version = "1.0.2"
description = "Frozen algorithm for pulse-to-pulse interval reconstruction and RMSSD estimation from contact finger PPG at 30 and 60 Hz"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Facundo Hernández-García"},
  {name = "José Meléndez-Gallardo"},
  {name = "Miguel Ángel Camejo-Alvarez"},
]
dependencies = [
  "joblib==1.5.3",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "wfdb==4.3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]
figures = ["matplotlib==3.10.9"]

[project.urls]
Repository = "https://github.com/biofyqdelejercicio-blip/finger-ppg-rmssd-reconstruction"
Archive = "https://doi.org/10.5281/zenodo.21501595"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
